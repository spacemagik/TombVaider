<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tomb Vaider</title>
  <!-- Spark 2.0 preview + Three r180 (see https://sparkjs.dev/2.0.0-preview/docs/). Vite resolves the same versions from package.json. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
      "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/preview/2.0.0/spark.module.js"
    }
  }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #0a0a0f; font-family: system-ui, sans-serif; }
    canvas { display: block; cursor: pointer; }
    #loading {
      position: fixed; inset: 0; z-index: 2;
      display: flex; align-items: center; justify-content: center;
      background: #0a0a0f; color: #b8b8c8; font-size: 15px;
      pointer-events: none; transition: opacity 0.4s ease;
    }
    #loading.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      display: none !important;
    }
    #hud {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 1;
      background: rgba(0,0,0,0.55); color: #c8c8d0; padding: 12px 20px;
      border-radius: 8px; font-size: 13px; pointer-events: none; max-width: 92vw; text-align: center;
    }
    #hud kbd { background: #333; padding: 2px 6px; border-radius: 4px; margin: 0 2px; }
    #hud .sub { display: block; margin-top: 6px; font-size: 11px; color: #888; }
    #splat-diag {
      position: fixed; top: 12px; left: 12px; z-index: 1; max-width: min(420px, 92vw);
      background: rgba(0,0,0,0.5); color: #a8a8b8; padding: 8px 12px; border-radius: 6px;
      font-size: 11px; line-height: 1.35; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="loading" aria-live="polite">Loading scene…</div>
  <div id="splat-diag" aria-live="polite"></div>
  <div id="hud">
    <kbd>WASD</kbd> / arrows move · <kbd>Shift</kbd> run · <kbd>Space</kbd> jump · <kbd>Q</kbd>/<kbd>E</kbd> up/down
    · drag canvas look · <kbd>L</kbd> pointer lock · scroll zoom
    <span class="sub"><kbd>G</kbd> control panel · Spark 2.0 LoD (prefer <code>ruins-lod.rad</code>) · if blank here, open same URL in Chrome/Safari (Cursor Simple Browser often blocks Spark)</span>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
